# Historical Universe Backtest Configuration
# ==========================================

# Pipeline Configuration
pipeline:
  base_dir: "backtest"
  freeze_days: 14
  window_days: 90
  
# CT.gov Search Configuration
ctgov:
  base_url: "https://clinicaltrials.gov/api/v2/studies"
  page_size: 1000
  max_pages: 50
  phases: ["PHASE2", "PHASE3"]
  study_type: "INTERVENTIONAL"
  
# Document Harvesting Configuration
harvesting:
  sources: ["sec", "pr", "abstracts"]
  sec:
    base_url: "https://www.sec.gov/Archives/edgar/data"
    search_url: "https://www.sec.gov/cgi-bin/browse-edgar"
    submissions_url: "https://data.sec.gov/submissions"
  pr:
    sources: ["businesswire", "prnewswire", "globenewswire"]
  abstracts:
    sources: ["ASCO", "ESMO", "AAIC"]
    
# Label Building Configuration
labeling:
  prefer_sources: ["8k", "pr", "abstract", "ctgov"]
  strict_coprimary: true
  confidence_threshold: 0.6
  
  # Outcome classification phrases
  positive_phrases:
    - "met the primary endpoint"
    - "achieved the primary endpoint"
    - "primary endpoint was met"
    - "successfully met the primary endpoint"
    - "demonstrated statistical significance"
    - "statistically significant improvement"
    - "primary endpoint achieved"
    - "met its primary endpoint"
    - "primary objective was met"
    - "successfully achieved the primary endpoint"
    
  negative_phrases:
    - "did not meet the primary endpoint"
    - "failed to meet the primary endpoint"
    - "missed the primary endpoint"
    - "primary endpoint was not met"
    - "did not achieve the primary endpoint"
    - "failed to achieve the primary endpoint"
    - "primary endpoint not met"
    - "did not demonstrate statistical significance"
    - "not statistically significant"
    - "failed to show statistical significance"
    
  coprimary_phrases:
    - "co-primary endpoint"
    - "co-primary endpoints"
    - "primary endpoints"
    - "multiple primary endpoints"

# Public Status Configuration
public_status:
  window_days: 90
  confidence_thresholds:
    high: 0.8
    medium: 0.6
    low: 0.4
  
# Time Splits Configuration
splits:
  train:
    start: "2018-01-01"
    end: "2020-12-31"
  val:
    start: "2021-01-01"
    end: "2021-12-31"
  test:
    start: "2022-01-01"
    end: "2023-12-31"

# Coverage Configuration
coverage:
  required_fields:
    - "primary_endpoint"
    - "n_total"
    - "itt_status"
  optional_fields:
    - "effect_size"
    - "p_value"
    - "phase"
    - "indication"
  scoreable_threshold: 0.7

# Backtest Configuration
backtest:
  k_values: [1, 3, 5, 10]
  thresholds: [0.8, 0.9, 0.95]
  precision_threshold: 0.8
  
# Output Configuration
output:
  formats: ["jsonl", "json", "csv"]
  include_metadata: true
  include_evidence: true
  
# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(levelname)s - %(message)s"
  file: "backtest/pipeline.log"
