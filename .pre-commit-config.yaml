repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
        args: [--pdb, --pdbcls, --pdb-mode, print, pprint, logging.debug, logging.info, logging.warning, logging.error, logging.critical]

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.11
        args: [--line-length=88]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=88]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=88, --extend-ignore=E203,W503]

  - repo: https://github.com/pycqa/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [-r, src/, -f, json, -o, bandit-report.json]
        exclude: |
          (?x)^(
              src/ncfd/tests/|
              tests/|
              examples/|
              scripts/
          )$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        args: [--ignore-missing-imports]

  - repo: local
    hooks:
      - id: check-datetime-usage
        name: Check datetime usage
        entry: python scripts/check_datetime_usage.py
        language: python
        files: \.py$
        pass_filenames: false

      - id: check-md5-usage
        name: Check MD5 usage
        entry: python scripts/check_md5_usage.py
        language: python
        files: \.py$
        pass_filenames: false

      - id: check-debug-prints
        name: Check for debug print statements
        entry: python scripts/check_debug_prints.py
        language: python
        files: \.py$
        pass_filenames: false
