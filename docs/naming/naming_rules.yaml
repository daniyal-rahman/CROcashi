version: 1
styles:
  db:
    table: snake_case_plural
    column: snake_case
    pk: id
    fk: "<ref_table>_id"
    timestamps: [created_at, updated_at]
    enums: PascalCase
  code:
    class: PascalCase
    function: snake_case
    variable: snake_case
    constant: SCREAMING_SNAKE_CASE
    enum: PascalCase
    enum_member: SCREAMING_SNAKE_CASE
    pydantic_model: PascalCase
    http_path: kebab-case
    http_handler: snake_case
rules:
  max_name_length: 64
  forbidden_prefixes: [tmp_, test_]
  abbreviations: { configuration: cfg, identifier: id }
  reserved_words: [type, class, index]
  foreign_key_format: "<ref_table>_id"
  check_ondelete:
    - relation: many_to_one
      expected: CASCADE
      rationale: "CASCADE ensures referential integrity and prevents orphaned records in dependent tables"
