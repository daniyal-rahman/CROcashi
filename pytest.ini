[pytest]
pythonpath = src

# Test markers
markers =
    e2e: End-to-end system tests (may be slow)
    integration: Integration tests
    unit: Unit tests
    slow: Slow tests that take more than 30 seconds
    live: Tests that require live external services
    asyncio: Async tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Minimum version
minversion = 6.0
