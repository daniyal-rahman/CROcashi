# Test Configuration for Method Auditor Test Suite
# PMC2978916 Required Design Fields with Section Constraints

# Test Data Configuration
test_data:
  paper_id: "pmc:PMC2978916"
  title: "Phase 1/2 Study of Atrasentan Combined with Pegylated Liposomal Doxorubicin in Platinum-Resistant Recurrent Ovarian Cancer"
  
  # Required design fields with expected values and constraints
  required_design_fields:
    endpoints:
      primary:
        description: "Primary endpoint"
        expected_value: "response_rate"
        required_sections: ["Methods", "Protocol"]
        constraint: "Must be specified in Methods/Protocol"
        priority: "high"
      
      secondary:
        description: "Secondary endpoint"
        expected_value: "survival_metrics"
        required_sections: ["Methods", "Protocol"]
        constraint: "Must be specified in Methods/Protocol"
        priority: "high"
    
    ascertainment:
      description: "Response ascertainment method"
      expected_value: "RECIST"
      cadence: "every_6_weeks"
      required_sections: ["Methods", "Protocol"]
      constraint: "Must specify RECIST + cadence if present"
      priority: "high"
    
    survival_method:
      description: "Survival analysis method"
      expected_value: "KM"
      allowed_values: ["KM", "inferred_KM", "not_reported"]
      policy: "Must be KM, inferred_KM, or not_reported per policy"
      required_sections: ["Methods", "Protocol"]
      priority: "high"
    
    design_archetype:
      description: "Study design archetype"
      expected_value: "single_arm_phase2_gehan"
      constraint: "Must be single_arm_phase2_gehan"
      required_sections: ["Methods", "Protocol"]
      priority: "high"
    
    gehan_two_stage:
      description: "Gehan two-stage design"
      expected_value: true
      constraint: "Must be true for this design"
      required_sections: ["Methods", "Protocol"]
      priority: "high"
    
    interim_looks:
      description: "Number of interim looks"
      expected_value: 1
      constraint: "Must be 1 for this design"
      required_sections: ["Methods", "Protocol"]
      priority: "high"
    
    analysis_denominators:
      response_n:
        description: "Response analysis denominator"
        expected_value: 19
        constraint: "Must be 19 based on eligibility criteria"
        required_sections: ["Methods", "Results"]
        priority: "high"
      
      ttp_os_n:
        description: "TTP/OS analysis denominator"
        expected_value: 22
        constraint: "Must be 22 based on evaluability criteria"
        required_sections: ["Methods", "Results"]
        priority: "high"
    
    site_geography:
      description: "Site geography information"
      expected_value: "not_reported"
      allowed_values: ["US", "Europe", "Asia", "Global", "not_reported"]
      constraint: "From Methods/Protocol or not_reported"
      required_sections: ["Methods", "Protocol"]
      priority: "medium"
    
    missingness:
      description: "Missing data handling"
      expected_value: "not_reported"
      allowed_values: ["complete_case", "imputation", "not_reported"]
      constraint: "not_reported unless stated"
      required_sections: ["Methods", "Protocol"]
      priority: "medium"

# Expected MethodCard fields
expected_method_card:
  endpoints:
    primary:
      value: "response_rate"
      span_ids: ["pmc:PMC2978916#p1:0-100"]
      required: true
    
    secondary:
      value: "survival_metrics"
      span_ids: ["pmc:PMC2978916#p1:100-200"]
      required: true
  
  ascertainment:
    value: "RECIST"
    cadence: "every_6_weeks"
    span_ids: ["pmc:PMC2978916#p1:200-300"]
    required: true
  
  survival_method:
    value: "KM"
    span_ids: ["pmc:PMC2978916#p1:300-400"]
    required: true
  
  design_archetype:
    value: "single_arm_phase2_gehan"
    span_ids: ["pmc:PMC2978916#p1:400-500"]
    required: true
  
  gehan_two_stage:
    value: true
    span_ids: ["pmc:PMC2978916#p1:400-500"]
    required: true
  
  interim_looks:
    value: 1
    span_ids: ["pmc:PMC2978916#p1:500-600"]
    required: true
  
  analysis_denominators:
    response_n:
      value: 19
      span_ids: ["pmc:PMC2978916#p2:100-200"]
      required: true
    
    ttp_os_n:
      value: 22
      span_ids: ["pmc:PMC2978916#p2:0-100"]
      required: true
  
  site_geography:
    value: "not_reported"
    span_ids: []
    required: false
  
  missingness:
    value: "not_reported"
    span_ids: []
    required: false

# Test Configuration
test_config:
  require_all_must_fills: true
  enforce_section_constraints: true
  require_provenance: true
  no_guessing_policy: true

# Processing Modes
processing_modes:
  deterministic:
    description: "Deterministic processing path"
    llm_assist: false
    expected_accuracy: 1.0
  
  llm_assist:
    description: "LLM-assisted processing path"
    llm_assist: true
    expected_accuracy: 1.0

# Test Execution Configuration
execution:
  # Test categories to run
  test_categories:
    - "must_fill_endpoints"
    - "must_fill_ascertainment"
    - "must_fill_survival_method"
    - "must_fill_design_archetype"
    - "must_fill_gehan_two_stage"
    - "must_fill_interim_looks"
    - "must_fill_analysis_denominators"
    - "section_constraints"
    - "provenance_validation"
    - "deterministic_path_validation"
    - "llm_assist_path_validation"
  
  # Performance thresholds
  performance:
    max_execution_time: 300  # 5 minutes
    max_memory_usage: 512    # 512 MB
    max_cpu_usage: 80        # 80%
  
  # Output configuration
  output:
    generate_reports: true
    report_format: ["html", "json"]
    save_artifacts: true
    artifact_directory: "test_results/method_auditor"

# Validation Rules
validation:
  # Must-fill requirements
  must_fills:
    require_all_endpoints: true
    require_ascertainment: true
    require_survival_method: true
    require_design_archetype: true
    require_gehan_two_stage: true
    require_interim_looks: true
    require_analysis_denominators: true
  
  # Section constraints
  section_constraints:
    geography_from_methods_protocol: true
    no_affiliation_inference: true
    enforce_section_bounds: true
  
  # Provenance requirements
  provenance:
    every_scalar_has_spans: true
    not_reported_if_no_spans: true
    no_guessing_policy: true
    span_ownership_validation: true

# Error Handling
error_handling:
  # Error tolerance levels
  tolerance:
    missing_must_fills: 0        # 0% tolerance for missing must-fills
    section_constraint_violations: 0  # 0% tolerance for constraint violations
    provenance_violations: 0     # 0% tolerance for provenance violations
    guessing_violations: 0       # 0% tolerance for guessing
  
  # Error reporting
  reporting:
    detailed_errors: true
    include_stack_traces: true
    save_error_logs: true
    error_log_directory: "test_results/errors"

# Logging Configuration
logging:
  level: "INFO"
  format: "[%(levelname)s] %(name)s: %(message)s"
  handlers:
    - type: "console"
      level: "INFO"
    - type: "file"
      level: "DEBUG"
      filename: "test_results/method_auditor.log"
  
  # Performance logging
  performance:
    log_execution_time: true
    log_memory_usage: true
    log_cpu_usage: true
    log_field_extraction: true
    log_constraint_validation: true
    log_provenance_checks: true

# Expected Results
expected_results:
  # Must-fill expectations
  must_fills:
    endpoints: 100.0
    ascertainment: 100.0
    survival_method: 100.0
    design_archetype: 100.0
    gehan_two_stage: 100.0
    interim_looks: 100.0
    analysis_denominators: 100.0
    all_required: 100.0
  
  # Section constraint expectations
  section_constraints:
    geography_source: 100.0
    no_affiliation_inference: 100.0
    section_bounds: 100.0
  
  # Provenance expectations
  provenance:
    span_citation: 100.0
    not_reported_policy: 100.0
    no_guessing: 100.0
  
  # Processing path expectations
  processing_paths:
    deterministic_accuracy: 100.0
    llm_assist_accuracy: 100.0
    independent_criteria: 100.0

# Test Scenarios
test_scenarios:
  # Must-fill scenarios
  must_fills:
    endpoints:
      primary: "response_rate"
      secondary: "survival_metrics"
      required_sections: ["Methods", "Protocol"]
    
    ascertainment:
      method: "RECIST"
      cadence: "every_6_weeks"
      required_sections: ["Methods", "Protocol"]
    
    survival_method:
      value: "KM"
      allowed_values: ["KM", "inferred_KM", "not_reported"]
      policy_compliant: true
    
    design_archetype:
      value: "single_arm_phase2_gehan"
      constraint_satisfied: true
    
    gehan_two_stage:
      value: true
      constraint_satisfied: true
    
    interim_looks:
      value: 1
      constraint_satisfied: true
    
    analysis_denominators:
      response_n: 19
      ttp_os_n: 22
      source_sections: ["Methods", "Results"]
  
  # Section constraint scenarios
  section_constraints:
    geography:
      source_sections: ["Methods", "Protocol"]
      not_inferred_from: ["Affiliations", "Author_info"]
      default_value: "not_reported"
    
    missingness:
      source_sections: ["Methods", "Protocol"]
      default_value: "not_reported"
  
  # Provenance scenarios
  provenance:
    span_requirements:
      min_spans_per_field: 1
      document_ownership: true
      traceability: true
    
    not_reported_policy:
      no_spans_means_not_reported: true
      no_guessing: true
      clean_failure: true
  
  # Processing path scenarios
  processing_paths:
    deterministic:
      llm_assist: false
      expected_accuracy: 1.0
      independence: true
    
    llm_assist:
      llm_assist: true
      expected_accuracy: 1.0
      provenance_maintained: true
