# Test Configuration for Comprehensive Study Card System Tests

# Test Data Configuration
test_data:
  paper_id: "pmc:PMC2978916"
  title: "Phase 1/2 Study of Atrasentan Combined with Pegylated Liposomal Doxorubicin in Platinum-Resistant Recurrent Ovarian Cancer"
  
  # Gold standard data paths
  gold_standard_dir: "test_data/gold_standard"
  method_card_file: "method_card_gold.json"
  results_factsheet_file: "results_factsheet_gold.json"
  claims_file: "claims_gold.json"

# Test Configuration
test_config:
  # Performance thresholds
  max_execution_time: 10.0  # seconds
  max_memory_usage: 1024    # MB
  
  # Span budgets for testing
  span_budgets:
    methods: 12
    results: 12
    tables: 5
  
  # Quality thresholds
  min_confidence: 0.7
  min_similarity: 0.85
  
  # Test modes
  test_modes:
    - "deterministic_only"
    - "llm_assist_only"
    - "dual_path_fusion"
  
  # Retrieval modes
  retrieval_modes:
    - "bm25_only"
    - "bm25_dense_union"

# Validation Rules
validation:
  # Provenance requirements
  require_span_ids: true
  require_input_hash: true
  
  # Unit normalization
  enforce_unit_conversion: true
  allow_unit_variants: false
  
  # Section constraints
  enforce_section_rules: true
  
  # Coverage requirements
  min_concept_coverage: 8
  min_span_coverage: 16

# LLM Configuration
llm:
  # Model settings
  model_name: "gpt-4"
  temperature: 0.1
  max_tokens: 2000
  
  # Prompt versions
  method_auditor_prompt_version: "1.0.0"
  results_distiller_prompt_version: "1.0.0"
  claimizer_prompt_version: "1.0.0"
  gate_proposer_prompt_version: "1.0.0"

# Deterministic Configuration
deterministic:
  # Validation rules
  strict_validation: true
  allow_inferred_values: false
  
  # Computation settings
  precision: 0.001
  max_iterations: 1000

# Test Output Configuration
output:
  # Results directory
  results_dir: "test_results"
  
  # Logging
  log_level: "INFO"
  log_file: "test_comprehensive.log"
  
  # Artifacts
  save_artifacts: true
  artifact_format: "json"
  
  # Reports
  generate_reports: true
  report_format: "html"
  include_metrics: true

# Error Handling
error_handling:
  # Graceful degradation
  allow_partial_results: true
  max_errors_per_component: 3
  
  # Recovery
  retry_failed_components: true
  max_retries: 2
  
  # Reporting
  detailed_error_messages: true
  include_stack_traces: false

# Performance Monitoring
performance:
  # Metrics collection
  collect_timing: true
  collect_memory: true
  collect_cpu: false
  
  # Thresholds
  warning_threshold: 0.8  # 80% of max
  error_threshold: 0.95   # 95% of max
  
  # Sampling
  sample_rate: 1.0  # 100% of operations
